[project]
name = "octobeat"
version = "0.1.0"
description = "Generate SongMaps from audio recordings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "David Rubert" }]
keywords = ["audio", "music", "beat", "songmap", "octobeat"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "click>=8.1",
    "jsonschema>=4.25",
    "librosa>=0.11",
    "numpy>=2.0",
    "pydantic>=2.11,<3",
    "platformdirs>=4.3,<5",
    "yt-dlp>=2025.7.21",
]

[project.scripts]
octobeat = "octobeat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-cov>=7.0", "ruff>=0.12", "mypy>=1.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
